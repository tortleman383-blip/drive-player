# Publishes the player to GitHub Pages. Tests gate the deploy: a broken
# player should never become the live page.

name: Publish the player

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling, so the last
# push always ends up being what is live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    # Playwright's own image ships the browser and its system libraries, so
    # there is no download and no apt-get. Installing the browser on a bare
    # runner meant "playwright install --with-deps", which shells out to apt
    # and stalls indefinitely whenever the runner's dpkg lock is held - it sat
    # there for 23 minutes once, blocking a deploy behind it.
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-jammy

    # Nothing here should take five minutes. Fail rather than hang.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: node tests/units.js

      - name: Install the playwright client
        run: npm install --no-save playwright@1.49.1

      - name: End-to-end tests
        run: node tests/e2e.js

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement creates the Pages site on the first run, so the repo does
      # not have to be configured by hand before this workflow can deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
